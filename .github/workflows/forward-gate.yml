name: Forward gate

# This workflow encodes the gate the forward round verified by hand on one
# machine (see docs/forward/TOTAL_RECEIPT.md §4). It exists so the same gate can
# run on a second machine or in CI; until it has actually run there, the CI tier
# of the evidence is empty and the receipt says so.
#
# Two environment facts it pins on purpose:
#  - WORKBUDDY_CONFIG_DIR: the gateway refuses to guess between several data
#    directories. Tests build their own fixtures, so the gate points the default
#    config at an empty directory it creates itself and never at a user profile.
#  - Serial concurrency: the suite shares one machine profile (SQLite, process
#    table, named pipes). Three flaps were observed under parallel agents; the
#    candidate baseline is the serial run.

on:
  workflow_dispatch:
  pull_request:
  # Feature branches get the same gate as main: without this the only way to see
  # the gate run is an authenticated dispatch or a pull request.
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Verify source snapshot
        run: node verify-snapshot.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare an empty configuration directory
        # `runner` is not readable from jobs.<id>.env, so the directory is decided
        # here and exported for every later step through GITHUB_ENV.
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'workbuddy-gate-config'
          New-Item -ItemType Directory -Force -Path $config | Out-Null
          "WORKBUDDY_CONFIG_DIR=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "config dir: $config"
      - name: Build the gateway
        run: npm run build
      - name: Type check the TaskView contract
        run: npm run typecheck:task-view
      - name: Acceptance matrix must still match the original design
        run: |
          npm run acceptance:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Backend suite, serial
        run: |
          npx tsx --test --test-concurrency=1 test/**/*.test.ts 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\backend-suite.log" -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            $log = Get-Content "$env:RUNNER_TEMP\backend-suite.log"
            for ($i = 0; $i -lt $log.Count; $i++) {
              if ($log[$i] -match '✖ .*\(\d+\.\d+ms\)') {
                Write-Host "::error::$($log[$i].Trim())"
                for ($j = 1; $j -le 14 -and ($i + $j) -lt $log.Count; $j++) { $line = $log[$i + $j].Trim(); if ($line) { Write-Host "::error::  $line" } }
                break
              }
            }
            if (Test-Path ci-failure.txt) { Get-Content ci-failure.txt -Encoding utf8 | ForEach-Object { Write-Host "::error::test-detected $_" } }
            exit $LASTEXITCODE
          }
      - name: Workbench frontend tests
        run: |
          npm run test:workbench 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\workbench-suite.log" -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            $log = Get-Content "$env:RUNNER_TEMP\workbench-suite.log"
            $shown = 0
            foreach ($line in $log) {
              if ($shown -ge 10) { break }
              if ($line -match '^\s*(not ok|✖)|AssertionError|TypeError|ReferenceError|ENOENT|EACCES|expected|actual') {
                Write-Host "::error::workbench $($line.Trim())"
                $shown += 1
              }
            }
            exit $LASTEXITCODE
          }
      - name: Desktop policy tests
        run: npm run desktop:test
      - name: Package the candidate from the fresh build
        run: |
          node scripts/package.mjs "$env:RUNNER_TEMP\forward-candidate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Join-Path "$env:RUNNER_TEMP\forward-candidate" 'codex-workbuddy-gateway-v0.7.1.zip'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "candidate sha256: $hash"
          node scripts/candidate-installation.mjs check --package $zip --expect-sha256 $hash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read-only workbench HTTP smoke
        run: node scripts/workbench-smoke.mjs
